{% extends "base.html" %}{% block content %}
<div class="mt-4">
  <form method="post" id="car-form" class="car-form">
    {% csrf_token %}
    <!-- Typ pojazdu usunięty (domyślnie 'osobowy') -->
    <div class="form-group row align-items-center">
      <label
        for="{{ form.brand.id_for_label }}"
        class="col-sm-4 col-form-label font-weight-bold text-secondary"
        >{{ form.brand.label }}</label
      >
      <div class="col-sm-8">{{ form.brand }}</div>
    </div>
    <div class="form-group row align-items-center">
      <label
        for="{{ form.model.id_for_label }}"
        class="col-sm-4 col-form-label font-weight-bold text-secondary"
        >{{ form.model.label }}</label
      >
      <div class="col-sm-8">{{ form.model }}</div>
    </div>
    <div class="form-group row align-items-center">
      <label
        for="{{ form.generation.id_for_label }}"
        class="col-sm-4 col-form-label font-weight-bold text-secondary"
        >{{ form.generation.label }}</label
      >
      <div class="col-sm-8">{{ form.generation }}</div>
    </div>
    <div class="form-group row align-items-center">
      <label
        for="{{ form.series.id_for_label }}"
        class="col-sm-4 col-form-label font-weight-bold text-secondary"
        >{{ form.series.label }}</label
      >
      <div class="col-sm-8">{{ form.series }}</div>
    </div>
    <div class="form-group row align-items-center">
      <label
        for="{{ form.modification.id_for_label }}"
        class="col-sm-4 col-form-label font-weight-bold text-secondary"
        >{{ form.modification.label }}</label
      >
      <div class="col-sm-8">{{ form.modification }}</div>
    </div>
    <div class="form-group row align-items-center mb-0">
      <label
        for="{{ form.equipment.id_for_label }}"
        class="col-sm-4 col-form-label font-weight-bold text-secondary"
        >{{ form.equipment.label }}</label
      >
      <div class="col-sm-8">{{ form.equipment }}</div>
    </div>
  </form>

  {% if response %}
  <div class="card mt-4">
    <div class="card-body">
      <h5 class="card-title">AI Response</h5>
      <pre class="mb-0">{{ response }}</pre>
    </div>
  </div>
  {% endif %}
</div>
<script>
  const watchFieldIds = [
    "{{ form.brand.id_for_label }}",
    "{{ form.model.id_for_label }}",
    "{{ form.generation.id_for_label }}",
    "{{ form.series.id_for_label }}",
    "{{ form.modification.id_for_label }}",
  ];
  const carForm = document.getElementById("car-form");
  if (carForm) {
    watchFieldIds.forEach((fieldId) => {
      const field = document.getElementById(fieldId);
      if (!field) {
        return;
      }
      field.addEventListener("change", () => {
        carForm.submit();
      });
    });
  }
</script>
{% endblock %}
