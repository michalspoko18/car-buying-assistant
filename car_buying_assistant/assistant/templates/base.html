<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %} Car Buying Assistant {% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      input[type="radio"] {
        accent-color: #0284c7;
        height: 1rem;
        width: 1rem;
      }

      input[type="checkbox"] {
        accent-color: #01496d;
        height: 1.1rem;
        width: 1.1rem;
      }

      .radio-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .radio-list li label {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
    </style>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900">
    <nav class="border-b border-slate-200 bg-white">
      <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-4">
        <a class="text-lg font-semibold text-slate-900" href="{% url 'home' %}">Car Buying Assistant</a>
      </div>
    </nav>
    <main class="mx-auto w-full max-w-6xl px-4 py-8">
      {% block content %} {% endblock %}
    </main>
  </body>
</html>
